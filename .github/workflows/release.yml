name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Versionado semantico
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Ejecutar release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_TYPE: maven
        run: bash .github/scripts/release.sh

  package:
    name: Empaquetar servidor (JAR)
    needs: release
    if: >-
      github.event.head_commit.author.email != '41898282+github-actions[bot]@users.noreply.github.com'
      && needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.release.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Compilar JAR
        run: mvn -B -DskipTests package

      - name: Ensamblar paquete de servidor
        run: bash packaging/assemble.sh "${{ needs.release.outputs.version }}"

      - name: Publicar JAR y paquete en el release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release.outputs.version }}
          files: |
            dist/ultron-${{ needs.release.outputs.version }}.jar
            dist/ultron-server-${{ needs.release.outputs.version }}.zip
          fail_on_unmatched_files: true

      - name: Guardar artefactos
        uses: actions/upload-artifact@v4
        with:
          name: ultron-server
          path: |
            dist/ultron-${{ needs.release.outputs.version }}.jar
            dist/ultron-server-${{ needs.release.outputs.version }}.zip
          if-no-files-found: error

  deploy:
    name: Deploy a produccion
    needs: package
    if: needs.package.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar artefacto
        uses: actions/download-artifact@v4
        with:
          name: ultron-server
          path: dist

      - name: Preparar SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_SSH_KEY:-}" || { echo "Falta secret DEPLOY_SSH_KEY"; exit 1; }
          test -n "${DEPLOY_HOST:-}" || { echo "Falta secret DEPLOY_HOST"; exit 1; }
          test -n "${DEPLOY_USER:-}" || { echo "Falta secret DEPLOY_USER"; exit 1; }
          PORT="${DEPLOY_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          {
            echo "DEPLOY_HOST=$DEPLOY_HOST"
            echo "DEPLOY_USER=$DEPLOY_USER"
            echo "DEPLOY_PORT=$PORT"
          } >> "$GITHUB_ENV"

      - name: Subir JAR y reiniciar servicio
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          JAR="dist/ultron-${VERSION}.jar"
          test -f "$JAR"
          REMOTE_TMP="/tmp/ultron-${VERSION}.jar"
          scp -i ~/.ssh/deploy_key -P "$DEPLOY_PORT" -o IdentitiesOnly=yes \
            "$JAR" "${DEPLOY_USER}@${DEPLOY_HOST}:${REMOTE_TMP}"
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o IdentitiesOnly=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "/opt/ultron/deploy.sh '${REMOTE_TMP}' && rm -f '${REMOTE_TMP}'"

      - name: Health check remoto
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o IdentitiesOnly=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'EOF'
          set -euo pipefail
          for i in $(seq 1 60); do
            if systemctl is-active --quiet ultron; then
              if curl -fsS -m 5 "http://127.0.0.1:8081/graphql" \
                   -H 'content-type: application/json' \
                   -d '{"query":"{ __typename }"}' >/dev/null 2>&1; then
                echo "Servicio saludable"
                systemctl --no-pager --full status ultron | head -20
                exit 0
              fi
            else
              echo "Servicio no activo (intento $i)"
            fi
            sleep 3
          done
          echo "Health check falló"
          journalctl -u ultron -n 80 --no-pager || true
          exit 1
          EOF
