name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Versionado semantico
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Ejecutar release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_TYPE: maven
        run: bash .github/scripts/release.sh

  package:
    name: Empaquetar servidor (JAR)
    needs: release
    if: >-
      github.event.head_commit.author.email != '41898282+github-actions[bot]@users.noreply.github.com'
      && needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Compilar JAR
        run: mvn -B -DskipTests package

      - name: Ensamblar paquete de servidor
        run: bash packaging/assemble.sh "${{ needs.release.outputs.version }}"

      - name: Publicar JAR y paquete en el release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release.outputs.version }}
          files: |
            dist/ultron-${{ needs.release.outputs.version }}.jar
            dist/ultron-server-${{ needs.release.outputs.version }}.zip
          fail_on_unmatched_files: true

      - name: Guardar artefactos
        uses: actions/upload-artifact@v4
        with:
          name: ultron-server
          path: |
            dist/ultron-${{ needs.release.outputs.version }}.jar
            dist/ultron-server-${{ needs.release.outputs.version }}.zip
          if-no-files-found: error
