spring.application.name=ultron
server.port=8081
spring.datasource.url=jdbc:postgresql://localhost:5551/taller
spring.datasource.username=ultron
spring.datasource.password=ultron
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ---- GraphQL ----
spring.graphql.graphiql.enabled=true
spring.graphql.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*
spring.graphql.cors.allowed-methods=GET,POST,OPTIONS
spring.graphql.cors.allowed-headers=*

# ---- File Storage ----
# Carpeta de la PC donde corre el backend; nunca dentro del proyecto ni de /opt/ultron.
# Dev: ~/ultron-uploads. Servidor: ULTRON_UPLOAD_DIR=/var/lib/ultron/uploads en /opt/ultron/ultron.env.
file.storage.upload-dir=${ULTRON_UPLOAD_DIR:${user.home}/ultron-uploads}
file.storage.max-file-size=5242880

# ---- Multipart ----
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB